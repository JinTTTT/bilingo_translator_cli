[package]
name = "bilingo-desktop"
version = "0.2.0"
description = "A lightweight English and Chinese translator powered by DeepSeek"
authors = ["Bilingo contributors", "Pot Desktop contributors"]
license = "GPL-3.0-only"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.8", features = [ "window-start-dragging", "clipboard-write-text", "global-shortcut", "window-hide", "window-set-focus", "window-set-size"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
selection = "1.2.0"

[features]
custom-protocol = ["tauri/custom-protocol"]
